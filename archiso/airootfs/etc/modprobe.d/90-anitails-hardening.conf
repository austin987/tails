# AniTails Kernel Module Attack-Surface Reduction
# Includes Tails baselines + defense-in-depth blocks for recent Linux net/sched/IPsec CVEs:
# - act_pedit: blocks CVE-2026-46331 class tc pedit COW page-cache corruption
# - xt_TEE / nft_dup_ipv4 / nft_dup_ipv6 / esp4 / esp6: blocks CVE-2026-43503 DirtyClone class primitives
# - nf_conntrack_helper=0: disables ALGs (FTP/SIP/IRC) per Tails Tor enforcement design

options nf_conntrack nf_conntrack_helper=0

install act_pedit /bin/false
install xt_TEE /bin/false
install nft_dup_ipv4 /bin/false
install nft_dup_ipv6 /bin/false
install esp4 /bin/false
install esp6 /bin/false
install ah4 /bin/false
install ah6 /bin/false

# Uncommon network protocols
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install can /bin/false
install atm /bin/false
install rxrpc /bin/false

# DMA-capable / wireless / management engine attack surface
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install thunderbolt /bin/false
install bluetooth /bin/false
install btusb /bin/false
install bnep /bin/false
install mei /bin/false
install mei-me /bin/false
blacklist pcspkr
