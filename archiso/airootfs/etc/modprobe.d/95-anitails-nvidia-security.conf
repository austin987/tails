# AniTails NVIDIA Security, Amnesia & KMS Baseline
# NOTE: Do NOT add a static `blacklist nouveau` here! Dynamic conflict-free dispatch
# is written to volatile `/run/modprobe.d/10-anitails-gpu.conf` by `anitails-gpu-select`
# so pre-Turing GPUs retain `nouveau` fallback even on NVIDIA-enabled profiles.

# Prevent experimental Linux 7.x Rust Nova driver from racing with nouveau or nvidia-open
blacklist nova_core
blacklist nova_drm

# Amnesia invariant: NEVER dump discrete GPU VRAM allocations to /var/tmp or persistent disks!
# Sleep/hibernate are disabled in AniTails; any temporary driver scratch space MUST stay in 0700 RAM tmpfs.
options nvidia NVreg_PreserveVideoMemoryAllocations=0 NVreg_TemporaryFilePath=/run/anitails-nvidia-ram NVreg_UseKernelSuspendNotifiers=0
options nvidia_drm modeset=1 fbdev=1
