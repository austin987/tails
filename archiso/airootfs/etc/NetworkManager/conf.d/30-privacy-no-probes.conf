[connectivity]
# Never send clearnet HTTP connectivity probes (e.g. ping.archlinux.org)
enabled=false
uri=
interval=0

[main]
# Never send hostname over DHCP (prevents local LAN fingerprinting)
hostname-mode=none

[connection]
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.method=disabled
