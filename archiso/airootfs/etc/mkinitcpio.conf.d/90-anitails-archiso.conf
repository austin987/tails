# Archiso mkinitcpio configuration for AniTails (mkinitcpio >= 42.2, mkinitcpio-archiso >= 73)
# '?' suffix allows modules built directly into vmlinuz (=y) or renamed across 7.x without fatal abort
MODULES=(overlay? squashfs? loop? dm_mod? dm_crypt? aes_generic? xts? sha512_generic? veth?)
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
