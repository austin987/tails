# Archiso mkinitcpio configuration for AniTails (mkinitcpio >= 42.2, mkinitcpio-archiso >= 73)
# Note: `kms` is intentionally omitted from early initramfs (matching upstream archiso releng)
# so `simpledrm` provides early console and `anitails-gpu-guard.service` governs GPU module
# dispatch in airootfs with full `/usr/lib/firmware` access before udev probes DRM drivers.
MODULES=(overlay? squashfs? loop? dm_mod? dm_crypt? aes_generic? xts? sha512_generic? veth?)
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
