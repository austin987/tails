[Unit]
After=nftables.service anitails-create-netns.service
Requires=nftables.service anitails-create-netns.service

[Service]
# Arch Linux tor.service sets ProtectSystem=full and ReadOnlyDirectories=/;
# grant explicit runtime directory /run/tor for CookieAuthFile (/run/tor/control.authcookie)
RuntimeDirectory=tor
RuntimeDirectoryMode=0750
ReadWritePaths=-/var/lib/tor -/run/tor -/etc/tor
NoNewPrivileges=yes
PrivateTmp=yes
