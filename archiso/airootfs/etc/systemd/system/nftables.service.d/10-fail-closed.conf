[Unit]
# Atomic firewall MUST load BEFORE network-pre.target and NetworkManager.service;
# if nftables fails, trigger fail-closed anitails-network-panic.service immediately.
DefaultDependencies=no
Wants=network-pre.target
Before=network-pre.target NetworkManager.service tor.service
OnFailure=anitails-network-panic.service

[Service]
ExecStartPre=/usr/bin/nft -c -f /etc/nftables.conf
