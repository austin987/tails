#!/usr/sbin/nft -f
# AniTails Atomic Fail-Closed Tor-Enforcing Firewall (IPv4 + IPv6)
# Loaded atomically BEFORE network-pre.target and NetworkManager.service.
#
# Security design ported & tightened from Tails config/chroot_local-includes/etc/ferm/ferm.conf:
# - Default DROP on input, forward, output for BOTH IPv4 and IPv6 (inet family).
# - No Unsafe Browser / no 'clearnet' user bypass.
# - No RFC1918 LAN clearnet exception for desktop apps (prevents router HTTP/DoH/UPnP leaks).
# - No global 'ct state related' (only ICMP related on loopback, per Tails Tor enforcement design).
# - Only Arch 'tor' user (UID 43) may open NEW outbound TCP SYN connections.
# - Outbound UDP (QUIC 443, DNS 53, DoT 853, NTP 123, STUN, mDNS, NetBIOS) and ICMP are blocked;
#   only UID 0 DHCPv4 client renewal (UDP 68 -> 67) is permitted on non-loopback interfaces.
# - All external IPv6 packets are unconditionally dropped/rejected (mitigates Tails #20490 class leaks).

flush ruleset

define TOR_UID     = 43
define GDM_UID     = 120
define AMNESIA_UID = 1000

table inet anitails_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Drop malformed/invalid conntrack states immediately
        ct state invalid drop

        # Hard-block any IPv6 arriving on non-loopback interfaces
        meta nfproto ipv6 iifname != "lo" drop

        # Loopback: accept IPv4 loopback and IPv6 ::1 loopback only
        iifname "lo" meta nfproto ipv4 ip saddr 127.0.0.0/8 ip daddr 127.0.0.0/8 accept
        iifname "lo" meta nfproto ipv6 ip6 saddr ::1 ip6 daddr ::1 accept

        # Established IPv4 return traffic (NO global 'related')
        meta nfproto ipv4 ct state established accept

        # Isolated application network namespaces via veth pairs:
        # - tbb (Tor Browser): SOCKSPort 9050 + onion-grater filtered ControlPort 9051
        iifname "veth-tbb" ip saddr 10.200.1.2 ip daddr 10.200.1.1 tcp dport { 9050, 9051 } accept
        # - onioncircs (Onion Circuits viewer): filtered ControlPort 9051 only
        iifname "veth-onioncircs" ip saddr 10.200.1.6 ip daddr 10.200.1.5 tcp dport 9051 accept
        # - torlaunch (anitails-tor-connect bridge configurator): filtered ControlPort 9051 only
        iifname "veth-torlaunch" ip saddr 10.200.1.10 ip daddr 10.200.1.9 tcp dport 9051 accept
        # - onionshare: dedicated isolated SOCKSPort 9065 + filtered ControlPort 9051
        iifname "veth-onionshare" ip saddr 10.200.1.14 ip daddr 10.200.1.13 tcp dport { 9065, 9051 } accept

        # DHCPv4 replies to root NetworkManager internal DHCP client
        meta nfproto ipv4 iifname != "lo" udp sport 67 udp dport 68 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        # Drop invalid conntrack states immediately
        ct state invalid drop

        # Unconditionally block and log ALL non-loopback IPv6 outbound traffic
        meta nfproto ipv6 oifname != "lo" log prefix "Dropped outbound packet: " level debug flags skuid counter reject with icmpx type admin-prohibited

        # IPv6 loopback strictly restricted to ::1 established & local accessibility bus
        meta nfproto ipv6 oifname "lo" ip6 saddr ::1 ip6 daddr ::1 ct state established accept
        meta nfproto ipv6 oifname "lo" ip6 saddr ::1 ip6 daddr ::1 tcp dport 4101 meta skuid { $AMNESIA_UID, $GDM_UID } accept
        meta nfproto ipv6 log prefix "Dropped outbound packet: " level debug flags skuid counter reject with icmpv6 type port-unreachable

        # Established IPv4 connections (NO global 'related')
        meta nfproto ipv4 ct state established accept

        # Loopback IPv4 strict per-port and per-UID allowlist
        oifname "lo" meta nfproto ipv4 jump loopback_out

        # Allow host replies back into isolated veth namespaces
        oifname { "veth-tbb", "veth-onioncircs", "veth-torlaunch", "veth-onionshare" } meta nfproto ipv4 ct state established accept

        # Explicitly reject DNS, DoT, QUIC, NTP and NetBIOS from any non-Tor process before general rules
        oifname != "lo" tcp dport { 53, 137, 138, 139, 853 } log prefix "Dropped outbound packet: " level debug flags skuid counter reject with tcp reset
        oifname != "lo" udp dport { 53, 123, 137, 138, 139, 443, 853, 1900, 5353, 5355 } log prefix "Dropped outbound packet: " level debug flags skuid counter reject with icmp type port-unreachable

        # DHCPv4 unicast renewal by root NetworkManager ONLY (ports 68 -> 67)
        oifname != "lo" meta nfproto ipv4 meta skuid 0 udp sport 68 udp dport 67 accept

        # System Tor daemon (Arch UID 43): ONLY outbound IPv4 TCP SYN (new circuits / PT bridges)
        # Outbound UDP and ICMP remain blocked even for UID 43.
        oifname != "lo" meta nfproto ipv4 meta skuid $TOR_UID tcp flags & (fin | syn | rst | ack) == syn ct state new accept

        # Everything else (untorified TCP, UDP, QUIC, ICMP, LAN probes) is logged and rejected fail-closed
        log prefix "Dropped outbound packet: " level debug flags skuid counter reject with icmp type port-unreachable
    }

    chain loopback_out {
        # Related ICMP errors on loopback ONLY (Tails Tor enforcement design)
        ct state related ip protocol icmp accept

        # Stream-isolated Tor SOCKSPorts:
        # - 9050: default CLI/desktop apps (IsolateDestAddr IsolateDestPort)
        # - 9062: AniTails system tools (IsolateDestAddr IsolateDestPort SessionGroup=2)
        # - 9065: OnionShare/Electrum isolated group (IsolateDestAddr IsolateDestPort SessionGroup=4)
        ip daddr 127.0.0.1 tcp flags & (fin | syn | rst | ack) == syn tcp dport { 9050, 9062, 9065 } meta skuid $AMNESIA_UID accept
        ip daddr 127.0.0.1 tcp flags & (fin | syn | rst | ack) == syn tcp dport 9062 meta skuid 0 accept

        # Raw Tor ControlPort (9052): strictly root ONLY (used by anitails-onion-grater)
        ip daddr 127.0.0.1 tcp dport 9052 meta skuid 0 accept

        # Filtered Tor ControlPort (9051, anitails-onion-grater): amnesia and root
        ip daddr 127.0.0.1 tcp dport 9051 meta skuid { 0, $AMNESIA_UID } accept

        # Tor TransPort (9040, used via NAT redirect for 127.192.0.0/10 .onion Automap)
        ip daddr 127.0.0.1 tcp dport 9040 meta skuid $AMNESIA_UID accept

        # Tor DNSPort (5353, directly or via NAT redirect from 127.0.0.1:53)
        ip daddr 127.0.0.1 udp dport { 53, 5353 } meta skuid $AMNESIA_UID accept

        # Local CUPS printing & accessibility bus on 127.0.0.1
        ip daddr 127.0.0.1 tcp flags & (fin | syn | rst | ack) == syn tcp dport 631 meta skuid $AMNESIA_UID accept
        ip daddr 127.0.0.1 tcp flags & (fin | syn | rst | ack) == syn tcp dport 4101 meta skuid { $AMNESIA_UID, $GDM_UID } accept

        # Local OnionShare hidden service backend (Tor daemon connects to local ephemeral port)
        ip daddr 127.0.0.1 tcp flags & (fin | syn | rst | ack) == syn tcp dport 17600-17650 meta skuid { $AMNESIA_UID, $TOR_UID } accept
    }
}

table ip anitails_nat {
    chain output {
        type nat hook output priority -100; policy accept;

        # AutomapHostsOnResolve (.onion -> 127.192.0.0/10) redirected transparently to Tor TransPort 9040
        ip daddr 127.192.0.0/10 meta l4proto tcp redirect to :9040

        # Redirect local stub DNS queries (127.0.0.1:53 UDP) to Tor DNSPort (127.0.0.1:5353)
        ip daddr 127.0.0.1 udp dport 53 redirect to :5353
    }
}
