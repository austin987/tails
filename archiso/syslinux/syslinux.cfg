DEFAULT anitails
PROMPT 0
TIMEOUT 40

UI menu.c32
MENU TITLE AniTails Live System (BIOS Boot)

LABEL anitails
TEXT HELP
Boot AniTails x86_64 Live System (Read-only SquashFS + RAM overlay, Swap disabled).
ENDTEXT
MENU LABEL AniTails Live (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-anitails
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-anitails.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=2G nvme_load=yes lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=integrity module.sig_enforce=1 init_on_alloc=1 init_on_free=1 page_poison=1 slab_nomerge slub_debug=FZP vsyscall=none mce=0 mds=full,nosmt random.trust_cpu=off quiet

LABEL anitails-offline
MENU LABEL AniTails Live (Strict Offline Mode - All NIC Drivers Blocked)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-anitails
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-anitails.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=2G nvme_load=yes anitails.offline=1 lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=integrity module.sig_enforce=1 init_on_alloc=1 init_on_free=1 page_poison=1 slab_nomerge slub_debug=FZP vsyscall=none mce=0 mds=full,nosmt random.trust_cpu=off quiet

LABEL anitails-igpu
TEXT HELP
For Intel/AMD + NVIDIA Hybrid (Optimus/PRIME) laptops: uses integrated GPU only, avoids dual-GPU black screens and discrete VRAM retention.
ENDTEXT
MENU LABEL AniTails Live (Hybrid Laptop iGPU-Only Mode)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-anitails
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-anitails.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=2G nvme_load=yes anitails.gpu=igpu lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=integrity module.sig_enforce=1 init_on_alloc=1 init_on_free=1 page_poison=1 slab_nomerge slub_debug=FZP vsyscall=none mce=0 mds=full,nosmt random.trust_cpu=off quiet

LABEL anitails-safe-gpu
TEXT HELP
Safe Graphics Fallback (simpledrm/VESA + Mesa llvmpipe software rendering). Use if nouveau/NVIDIA KMS causes a black screen.
ENDTEXT
MENU LABEL AniTails Live (Safe Graphics Fallback - nomodeset)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-anitails
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-anitails.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=2G nvme_load=yes anitails.gpu=safe nomodeset nouveau.modeset=0 edd=off lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=integrity module.sig_enforce=1 init_on_alloc=1 init_on_free=1 page_poison=1 slab_nomerge slub_debug=FZP vsyscall=none mce=0 mds=full,nosmt random.trust_cpu=off quiet
