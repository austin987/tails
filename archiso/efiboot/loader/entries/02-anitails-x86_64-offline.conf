title    AniTails Live (Strict Offline Mode, UEFI)
sort-key 02
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-anitails
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux-anitails.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=2G nvme_load=yes anitails.offline=1 lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=integrity module.sig_enforce=1 init_on_alloc=1 init_on_free=1 page_poison=1 slab_nomerge vsyscall=none mds=full,nosmt random.trust_cpu=off quiet
