title    AniTails Live (Safe Graphics Fallback - nomodeset, UEFI)
sort-key 04
linux    /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-anitails
initrd   /%INSTALL_DIR%/boot/x86_64/initramfs-linux-anitails.img
options  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=2G nvme_load=yes anitails.gpu=safe nomodeset nouveau.modeset=0 edd=off lsm=landlock,lockdown,yama,integrity,apparmor,bpf lockdown=integrity module.sig_enforce=1 init_on_alloc=1 init_on_free=1 page_poison=1 slab_nomerge slub_debug=FZP vsyscall=none mce=0 mds=full,nosmt random.trust_cpu=off quiet
