# AniTails frozen-snapshot pacman.conf for mkarchiso
# SECURITY INVARIANTS:
# 1. SigLevel MUST NEVER be set to Never/Optional for packages.
# 2. Testing repositories (core-testing, extra-testing) MUST NEVER be enabled
#    to avoid ABI skew (e.g. openssl 4.1.0-1 vs stable openssl 3.6.5-1).
# 3. [core] and [extra] point to a single frozen Arch Linux Archive date
#    via mirrorlist.snapshot so partial upgrades cannot occur.

[options]
HoldPkg     = pacman glibc
Architecture = x86_64
Color
CheckSpace
ParallelDownloads = 2
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Required

# Local signed custom repository built in clean chroot from ./pkgbuilds/:
# - linux-anitails (7.3.3-1)
# - tor-anitails (0.4.9.16-1)
# - tor-browser-anitails (16.0-1)
# - lyrebird-anitails (16.0-1)
# - anitails-udev-watchdog (0.1.0-1)
[anitails-local]
SigLevel = Required
Server = file:///var/cache/anitails-local-repo

[core]
Include = /etc/pacman.d/mirrorlist.snapshot

[extra]
Include = /etc/pacman.d/mirrorlist.snapshot
